name: Prepare Release
on:
  workflow_dispatch:
    inputs:
      new_stable_version:
        description: Version number for the new stable release (leave empty to just strip `.dev1`)
        required: false
        default: 'auto'

permissions: {}

jobs:
  crowdin_download_translations:
    name: Download translations from Crowdin
    environment: Prepare Release
    needs: pr_stable_bump
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RED_RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.RED_RELEASER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Checkout repository and install Python
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'
      - name: Install dependencies
        run: |
          curl https://artifacts.crowdin.com/repo/GPG-KEY-crowdin | sudo apt-key add -
          echo "deb https://artifacts.crowdin.com/repo/deb/ /" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update -qq
          sudo apt-get install -y crowdin3
          pip install redgettext==3.4.2

      - name: Generate source files
        run: |
          make gettext
      - name: Download translations
        run: |
          make download_translations
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_IDENTIFIER }}

      - name: Configure Git user
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "$APP_SLUG[bot]"
          git config user.email "263745220+$APP_SLUG[bot]@users.noreply.github.com"

      - name: Commit changes
        env:
          BRANCH_NAME: automated/i18n
        run: |
          git checkout -b "$BRANCH_NAME"
          git add .
          git commit -m 'Automated Crowdin downstream'
          git push -u origin "$BRANCH_NAME"

      - name: Create the pull request
        env:
          PR_BODY: |
            This is an automated PR that is part of Prepare Release automated workflow (2 out of 2).
            Please ensure that there are no errors or invalid files are in the PR.
          MILESTONE: ${{ needs.pr_stable_bump.outputs.new_version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr create \
            --fill \
            --base "$GITHUB_REF" \
            --body "$PR_BODY" \
            --label 'Automated PR,Changelog Entry: Skipped' \
            --milestone "$MILESTONE"

  pr_stable_bump:
    name: Create a PR with stable version bump
    environment: Prepare Release
    runs-on: ubuntu-24.04
    outputs:
      new_version: ${{ steps.bump_version_stable.outputs.new_version }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RED_RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.RED_RELEASER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Checkout repository and install Python
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      # Create PR for stable version bump
      - name: Update Red version number from input
        id: bump_version_stable
        run: |
          python .github/workflows/scripts/bump_version.py
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ env.PYTHONPATH }}
          NEW_STABLE_VERSION: ${{ github.event.inputs.new_stable_version }}

      - name: Configure Git user
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "$APP_SLUG[bot]"
          git config user.email "263745220+$APP_SLUG[bot]@users.noreply.github.com"

      - name: Commit changes
        env:
          BRANCH_NAME: automated/pr_bumps/${{ steps.bump_version_stable.outputs.new_version }}
          COMMIT_MESSAGE: Version bump to ${{ steps.bump_version_stable.outputs.new_version }}
        run: |
          git checkout -b "$BRANCH_NAME"
          git add redbot/__init__.py
          git commit -m "$COMMIT_MESSAGE"
          git push -u origin "$BRANCH_NAME"

      - name: Create the pull request
        env:
          PR_BODY: |
            This is an automated PR that is part of Prepare Release automated workflow (1 out of 2).
            Please ensure that there are no errors or invalid files are in the PR.
          MILESTONE: ${{ steps.bump_version_stable.outputs.new_version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr create \
            --fill \
            --base "$GITHUB_REF" \
            --body "$PR_BODY" \
            --label 'Automated PR,Changelog Entry: Skipped' \
            --milestone "$MILESTONE"
